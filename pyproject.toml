[project]
name = "git-annex-remote-manyzips"
version = "0.0.1"
description = "A git-annex special remote that groups content into ZIP archives"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "annexremote>=1.6.6,<2",
]
authors = [
    { name = "Nei Cardoso de Oliveira Neto", email = "nei.neto@hotmail.com" },
]
keywords = ["git", "git-annex", "special-remote", "zip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Other/Nonlisted Topic",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Archiving :: Compression",
]

[project.urls]
Homepage = "https://github.com/cardoso-neto/git-annex-remote-manyzips"
Repository = "https://github.com/cardoso-neto/git-annex-remote-manyzips"

[project.scripts]
git-annex-remote-manyzips = "git_annex_remote_manyzips.manyzips:main"

[dependency-groups]
dev = [
    "ruff>=0.13.0",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = [".python-version", "test.sh", "tests/**"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "RUF"]
